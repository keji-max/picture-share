<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사진 지도</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --navy:#12263a; --blue:#2563eb; --pale:#eff6ff; --line:#e4e8ee; --text:#18212c; }
    * { box-sizing:border-box; } body { margin:0; background:#f6f8fb; color:var(--text); font-family:"Paperlogy", "Noto Sans KR", sans-serif; }
    header { height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:#fff; border-bottom:1px solid var(--line); }
    .brand { font-family:"Paperlogy", "Noto Sans KR", sans-serif; font-size:20px; font-weight:700; color:var(--navy); }
    .layout { height:calc(100vh - 72px); display:grid; grid-template-columns:360px 1fr; gap:0; }
    aside { background:#fff; border-right:1px solid var(--line); padding:22px 20px; overflow-y:auto; position:relative; z-index:2; }
    h1 { margin:0 0 5px; font-size:20px; } .hint { margin:0 0 18px; color:#64748b; font-size:13px; line-height:1.55; }
    .add-button { border:0; width:100%; background:var(--blue); color:#fff; font:inherit; font-weight:600; border-radius:10px; padding:13px; cursor:pointer; box-shadow:0 5px 12px #2563eb33; }.zone-panel { margin-top:8px; border:1px solid #d8e1ee; border-radius:10px; padding:0 11px 11px; }.zone-panel summary { padding:11px 2px; cursor:pointer; color:#334155; font-size:13px; font-weight:700; }.zone-action-row { display:flex; gap:7px; }.zone-action-row .zone-button { flex:1; }.zone-button { margin-top:7px; background:#fff; color:#1d4ed8; border:1px solid #93c5fd; box-shadow:none; }.delete-zone-button { color:#b91c1c; border-color:#fecaca; }.delete-zone-button:disabled { opacity:.45; cursor:not-allowed; }.zone-name-row { display:flex; gap:6px; margin-top:7px; }.zone-name-row input { min-width:0; flex:1; padding:9px; border:1px solid #cbd5e1; border-radius:8px; font:12px "Paperlogy",sans-serif; }.zone-name-row button { border:0; padding:8px 10px; border-radius:8px; background:#e0e7ff; color:#3730a3; font:600 11px "Paperlogy",sans-serif; cursor:pointer; }.zone-name-row input:disabled { background:#f8fafc; }
    .add-button:hover { background:#1d4ed8; }.photo-count { margin:24px 0 11px; color:#64748b; font-size:13px; }.photo-list { display:grid; gap:10px; }
    .card { display:grid; grid-template-columns:74px 1fr; min-height:78px; border:1px solid var(--line); border-radius:11px; overflow:hidden; cursor:pointer; background:#fff; }.card:hover { border-color:#93c5fd; background:#fafcff; }.card img { width:74px; height:78px; object-fit:cover; }.card-info { padding:10px; min-width:0; }.card-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.card-location { margin-top:4px; font-size:11px; color:#64748b; }.zone-heading-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:16px 0 5px; }.zone-heading-row:first-child { margin-top:0; }.zone-group { min-width:0; color:#334155; font:700 12px "Paperlogy",sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.zone-heading-actions { display:flex; gap:4px; flex-shrink:0; }.zone-action { border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:#475569; padding:3px 7px; font:600 10px "Paperlogy",sans-serif; cursor:pointer; }.zone-action:hover { border-color:#93c5fd; color:#1d4ed8; }.zone-edit { color:#7c3aed; border-color:#ddd6fe; }.zone-photos { display:grid; gap:10px; }.zone-photos[hidden] { display:none; }.zone-chip { display:inline-block; padding:2px 6px; background:#e0e7ff; color:#3730a3; border-radius:5px; font-size:10px; margin-top:5px; }
    #map { width:100%; height:100%; }.empty { margin-top:15px; padding:20px 13px; border:1px dashed #cbd5e1; border-radius:10px; text-align:center; color:#64748b; font-size:13px; line-height:1.7; }
    .leaflet-popup-content-wrapper { border-radius:12px; }.popup { width:210px; }.popup img { width:100%; height:130px; object-fit:cover; border-radius:7px; }.popup h3 { margin:8px 0 2px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.popup p { color:#64748b; margin:0 0 9px; font-size:11px; }.popup-actions { display:flex; gap:6px; }.small-button { flex:1; padding:7px 5px; border:0; border-radius:7px; font:600 11px "Paperlogy", "Noto Sans KR", sans-serif; cursor:pointer; }.download { color:#1d4ed8; background:#dbeafe; }.delete { color:#b91c1c; background:#fee2e2; }
    dialog { border:0; border-radius:16px; padding:0; width:min(440px,calc(100% - 32px)); box-shadow:0 24px 70px #0f172a42; } dialog::backdrop { background:#0f172a70; }.modal { padding:23px; }.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }.modal-header h2 { margin:0; font-size:18px; }.close { border:0; background:transparent; font-size:25px; cursor:pointer; color:#64748b; }.field { display:grid; gap:7px; margin-bottom:15px; font-size:13px; font-weight:600; }.field input { width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:10px; font:inherit; }.coords { padding:11px; border-radius:8px; background:var(--pale); color:#1e40af; font-size:12px; line-height:1.5; }.map-select { margin:5px 0 17px; border-radius:8px; background:#fff7ed; color:#9a3412; padding:10px; font-size:12px; }.modal-actions { display:flex; justify-content:flex-end; gap:8px; }.cancel { border:1px solid #cbd5e1; background:white; }.modal-actions button { border-radius:8px; padding:10px 13px; font:600 13px "Paperlogy", "Noto Sans KR", sans-serif; cursor:pointer; }.save { border:0; background:var(--blue); color:white; }
    #previewDialog { width:min(900px,calc(100% - 32px)); background:#111827; color:white; }.preview { padding:16px; }.preview-header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px; }.preview-title { margin:0; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.preview-image { width:100%; max-height:72vh; object-fit:contain; display:block; border-radius:9px; background:#020617; }.preview-close { color:white; }.preview-actions { display:flex; justify-content:flex-end; margin-top:12px; }.preview-download { background:#dbeafe; color:#1d4ed8; border:0; border-radius:8px; padding:9px 12px; font:600 13px "Paperlogy",sans-serif; cursor:pointer; }
    @media (max-width:720px) { header { height:58px; padding:0 17px; }.layout { height:calc(100vh - 58px); grid-template-columns:1fr; grid-template-rows:minmax(180px,38vh) 1fr; } aside { grid-row:1; border-right:0; border-bottom:1px solid var(--line); padding:15px 16px; }.photo-count { margin:15px 0 8px; }.photo-list { grid-template-columns:repeat(2,1fr); }.card { grid-template-columns:56px 1fr; min-height:60px; }.card img { width:56px;height:60px; }.card-info { padding:7px; }.card-location { display:none; } #map { grid-row:2; } }
  </style>
</head>
<body>
  <header><div class="brand">현장답사 쉐어링 : 이사진 어디야?</div><span style="font-size:12px;color:#64748b">내 기기에 안전하게 저장됨</span></header>
  <main class="layout">
    <aside><h1>나의 사진</h1><p class="hint">사진의 GPS를 자동으로 읽거나, 지도에서 직접 위치를 지정하세요.</p><button class="add-button" id="openUpload">+ 사진 추가</button><details class="zone-panel" open><summary>구역계 편집</summary><div class="zone-action-row"><button class="add-button zone-button" id="openZoneUpload">구역계 추가</button><button class="add-button zone-button delete-zone-button" id="deleteZones" disabled>구역계 삭제</button></div><div class="zone-name-row"><input id="zoneNameInput" type="text" placeholder="구역계 이름" disabled><button id="saveZoneName" type="button" disabled>이름 저장</button></div></details><input id="zoneInput" type="file" accept=".zip,.geojson,.json,application/zip" hidden><div class="photo-count" id="photoCount">사진 0장</div><div class="photo-list" id="photoList"></div><div class="empty" id="empty">아직 등록된 사진이 없습니다.<br>첫 사진을 지도에 올려보세요.</div></aside>
    <div id="map" aria-label="사진 지도"></div>
  </main>
  <dialog id="uploadDialog"><form class="modal" id="uploadForm"><div class="modal-header"><h2>사진 지도에 추가</h2><button class="close" type="button" id="closeDialog">×</button></div><label class="field">사진 파일<input id="photoInput" type="file" accept="image/*" multiple required></label><label class="field">사진 제목 <span style="font-weight:400;color:#64748b">(여러 장이면 공통 제목)</span><input id="titleInput" type="text" placeholder="예: 제주 해안 산책"></label><div class="coords" id="coords">사진을 선택하면 GPS 위치를 확인합니다.</div><div class="map-select" id="mapSelect">위치를 바꾸려면 아래 창을 닫고 지도에서 원하는 곳을 클릭하세요.</div><div class="modal-actions"><button class="cancel" type="button" id="cancel">취소</button><button class="save" type="button" id="savePhoto">사진 저장</button></div></form></dialog>
  <dialog id="previewDialog"><div class="preview"><div class="preview-header"><h2 class="preview-title" id="previewTitle"></h2><button class="close preview-close" type="button" id="closePreview">×</button></div><img id="previewImage" class="preview-image" alt="선택한 사진"><div class="preview-actions"><button class="preview-download" type="button" id="previewDownload">다운로드</button></div></div></dialog>
  <dialog id="renameDialog"><div class="modal"><div class="modal-header"><h2>구역계 이름 수정</h2><button class="close" type="button" id="closeRename">×</button></div><label class="field">구역계 이름<input id="renameInput" type="text" maxlength="60"></label><div class="modal-actions"><button class="cancel" type="button" id="cancelRename">취소</button><button class="save" type="button" id="saveRename">저장</button></div></div></dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
  <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
  <script>
    const map = L.map('map').setView([37.5665,126.9780], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap contributors' }).addTo(map);
    const dialog = document.querySelector('#uploadDialog'), fileInput = document.querySelector('#photoInput'), titleInput = document.querySelector('#titleInput');
    const state = { selectedLocation:null, pendingLocations:[], markers:new Map(), photos:[], zones:[], zoneLayer:null, collapsedZones:new Set(), editingZoneName:null };
    const $ = s => document.querySelector(s);
    let db;
    function openDB() { return new Promise((resolve,reject)=>{ const r=indexedDB.open('photo-map-db',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'}); r.onsuccess=()=>{db=r.result;resolve()}; r.onerror=()=>reject(r.error); }); }
    function store(operation, value) { return new Promise((resolve,reject)=>{ const transactionMode=value===undefined?'readonly':'readwrite'; const t=db.transaction('photos',transactionMode); const objectStore=t.objectStore('photos'); const req=value===undefined?objectStore.getAll():objectStore[operation](value); req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); }); }
    const locText = p => `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;
    function markerIcon() { return L.divIcon({className:'',html:'<div style="width:16px;height:16px;border:2px solid white;border-radius:50% 50% 50% 0;background:#2563eb;transform:rotate(-45deg);box-shadow:0 1px 4px #0005"></div>',iconSize:[16,16],iconAnchor:[8,15]}); }
    function zoneNameFor(photo) { const point=[photo.lng,photo.lat]; const found=state.zones.find(feature=>pointInFeature(point,feature)); return found?featureName(found):'미분류'; }
    function featureName(feature) { const p=feature.properties||{}; return p.__displayName||p.name||p.NAME||p.명칭||p.구역명||p.구역||Object.values(p).find(v=>typeof v==='string'&&v.trim())||'구역'; }
    function pointInRing(point,ring) { let inside=false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];const intersect=((yi>point[1])!==(yj>point[1]))&&(point[0]<(xj-xi)*(point[1]-yi)/(yj-yi)+xi);if(intersect)inside=!inside;} return inside; }
    function pointInFeature(point,feature) { const g=feature.geometry;if(!g)return false; const polygons=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[]; return polygons.some(poly=>pointInRing(point,poly[0])&&!poly.slice(1).some(hole=>pointInRing(point,hole))); }
    function zoomToZone(name) { const features=state.zones.filter(feature=>featureName(feature)===name); if(!features.length)return; const bounds=L.geoJSON({type:'FeatureCollection',features}).getBounds(); if(bounds.isValid())map.fitBounds(bounds,{padding:[35,35],maxZoom:17}); }
    function renameZone(name) { state.editingZoneName=name; $('#renameInput').value=name; $('#renameDialog').showModal(); $('#renameInput').focus(); }
    function addMarker(photo) { const url=URL.createObjectURL(photo.file); const zone=zoneNameFor(photo); const m=L.marker([photo.lat,photo.lng],{icon:markerIcon()}).addTo(map); const popup=`<div class="popup"><img src="${url}" alt="" style="cursor:pointer" onclick="openPreview('${photo.id}')"><h3>${escapeHtml(photo.title)}</h3><p>${escapeHtml(zone)} · ${locText(photo)}</p><div class="popup-actions"><button class="small-button download" onclick="downloadPhoto('${photo.id}')">다운로드</button><button class="small-button delete" onclick="deletePhoto('${photo.id}')">삭제</button></div></div>`; m.bindPopup(popup); state.markers.set(photo.id,m); }
    function escapeHtml(value){const d=document.createElement('div');d.textContent=value;return d.innerHTML}
    function renderZones() { if(state.zoneLayer)map.removeLayer(state.zoneLayer); const hasZones=!!state.zones.length; $('#deleteZones').disabled=!hasZones; $('#zoneNameInput').disabled=!hasZones; $('#saveZoneName').disabled=!hasZones; if(!hasZones){$('#zoneNameInput').value='';return;} $('#zoneNameInput').value=featureName(state.zones[0]); state.zoneLayer=L.geoJSON({type:'FeatureCollection',features:state.zones},{style:{color:'#7c3aed',weight:3,fillColor:'#a78bfa',fillOpacity:.14},onEachFeature:(feature,layer)=>layer.bindTooltip(featureName(feature),{sticky:true})}).addTo(map); }
    async function render() { state.markers.forEach(m=>map.removeLayer(m));state.markers.clear(); $('#photoList').innerHTML=''; $('#photoCount').textContent=`사진 ${state.photos.length}장 · 구역 ${state.zones.length}개`; $('#empty').style.display=state.photos.length?'none':'block'; const groups=new Map(); state.photos.forEach(p=>{const name=zoneNameFor(p);if(!groups.has(name))groups.set(name,[]);groups.get(name).push(p)}); groups.forEach((photos,name)=>{const isCollapsed=state.collapsedZones.has(name);const row=document.createElement('div');row.className='zone-heading-row';const heading=document.createElement('div');heading.className='zone-group';heading.textContent=`${name} (${photos.length})`;const actions=document.createElement('div');actions.className='zone-heading-actions';if(name!=='미분류'){const move=document.createElement('button');move.type='button';move.className='zone-action';move.textContent='이동';move.onclick=()=>zoomToZone(name);const edit=document.createElement('button');edit.type='button';edit.className='zone-action zone-edit';edit.textContent='수정';edit.onclick=()=>renameZone(name);actions.append(move,edit);}const toggle=document.createElement('button');toggle.type='button';toggle.className='zone-action';toggle.textContent=isCollapsed?'펼치기':'접기';actions.append(toggle);row.append(heading,actions);$('#photoList').append(row);const photoWrap=document.createElement('div');photoWrap.className='zone-photos';photoWrap.hidden=isCollapsed;toggle.onclick=()=>{photoWrap.hidden=!photoWrap.hidden;const collapsed=photoWrap.hidden;collapsed?state.collapsedZones.add(name):state.collapsedZones.delete(name);toggle.textContent=collapsed?'펼치기':'접기';};photos.forEach(p=>{addMarker(p);const u=URL.createObjectURL(p.file);const c=document.createElement('article');c.className='card';c.innerHTML=`<img src="${u}" alt=""><div class="card-info"><div class="card-title">${escapeHtml(p.title)}</div><div class="zone-chip">${escapeHtml(name)}</div><div class="card-location">${locText(p)}</div></div>`;c.onclick=()=>openPreview(p.id);photoWrap.append(c);});$('#photoList').append(photoWrap); }); renderZones(); }
    window.downloadPhoto = id => { const p=state.photos.find(x=>x.id===id);const a=document.createElement('a');a.href=URL.createObjectURL(p.file);a.download=p.originalName||p.title;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    window.openPreview = id => { const p=state.photos.find(x=>x.id===id); if(!p)return; $('#previewTitle').textContent=p.title; const url=URL.createObjectURL(p.file); $('#previewImage').src=url; $('#previewDownload').onclick=()=>downloadPhoto(id); $('#previewDialog').showModal(); };
    $('#closePreview').onclick=()=>{ $('#previewDialog').close(); URL.revokeObjectURL($('#previewImage').src); $('#previewImage').removeAttribute('src'); };
    $('#closeRename').onclick=$('#cancelRename').onclick=()=>$('#renameDialog').close();
    $('#saveRename').onclick=()=>{const next=$('#renameInput').value.trim();const previous=state.editingZoneName;if(!next){alert('구역계 이름을 입력해주세요.');return;}if(previous)state.zones.filter(feature=>featureName(feature)===previous).forEach(feature=>feature.properties={...(feature.properties||{}),__displayName:next});localStorage.setItem('photo-map-zones',JSON.stringify(state.zones));$('#renameDialog').close();state.editingZoneName=null;render();};
    window.deletePhoto = async id => { const p=state.photos.find(x=>x.id===id); if(!confirm(`“${p.title}” 사진을 삭제할까요?`))return; await store('delete',id);state.photos=state.photos.filter(x=>x.id!==id);render(); };
    function updateCoords(){ $('#coords').textContent=state.selectedLocation?`선택된 위치: ${locText(state.selectedLocation)}`:'사진을 선택하면 GPS 위치를 확인합니다.'; }
    map.on('click',e=>{ state.selectedLocation=e.latlng; updateCoords(); $('#mapSelect').textContent='지도에서 위치를 선택했습니다. 이제 사진 추가를 눌러 저장하세요.'; });
    $('#openUpload').onclick=()=>dialog.showModal(); $('#closeDialog').onclick=$('#cancel').onclick=()=>dialog.close();
    $('#openZoneUpload').onclick=()=>$('#zoneInput').click();
    $('#saveZoneName').onclick=()=>{const name=$('#zoneNameInput').value.trim();if(!name){alert('구역계 이름을 입력해주세요.');return;}state.zones.forEach(feature=>feature.properties={...(feature.properties||{}),__displayName:name});localStorage.setItem('photo-map-zones',JSON.stringify(state.zones));render();};
    $('#deleteZones').onclick=()=>{if(!state.zones.length)return;if(!confirm(`구역계 ${state.zones.length}개를 삭제할까요? 사진은 삭제되지 않습니다.`))return;state.zones=[];localStorage.removeItem('photo-map-zones');render();};
    $('#zoneInput').onchange=async()=>{const file=$('#zoneInput').files[0];if(!file)return;try{let data;if(file.name.toLowerCase().endsWith('.zip')){data=await shp(await file.arrayBuffer());if(Array.isArray(data))data={type:'FeatureCollection',features:data.flatMap(x=>x.features||[])};}else data=JSON.parse(await file.text());const features=data.type==='FeatureCollection'?data.features:[data];const polygonFeatures=features.filter(f=>f.geometry&&['Polygon','MultiPolygon'].includes(f.geometry.type));if(!polygonFeatures.length)throw new Error('폴리곤 데이터 없음');state.zones=polygonFeatures;localStorage.setItem('photo-map-zones',JSON.stringify(state.zones));render();const bounds=state.zoneLayer.getBounds();if(bounds.isValid())map.fitBounds(bounds,{padding:[30,30]});alert(`${polygonFeatures.length}개 구역계를 지도에 표시했습니다.`);}catch(error){console.error(error);alert('구역계를 읽지 못했습니다. .shp, .shx, .dbf, .prj 파일을 모두 포함한 ZIP 또는 GeoJSON 파일을 사용해주세요.');}finally{$('#zoneInput').value='';}};
    fileInput.onchange=async()=>{ const files=[...fileInput.files]; if(!files.length)return; state.pendingLocations=await Promise.all(files.map(async f=>{try{const gps=await exifr.gps(f);return gps&&gps.latitude?{lat:gps.latitude,lng:gps.longitude}:null}catch{return null}})); const gpsCount=state.pendingLocations.filter(Boolean).length; if(gpsCount===files.length){state.selectedLocation=state.pendingLocations[0];$('#mapSelect').textContent=`${files.length}장 모두 GPS 위치를 찾았습니다.`;} else if(gpsCount){$('#mapSelect').textContent=`${files.length}장 중 ${gpsCount}장의 GPS 위치를 찾았습니다. 나머지는 지도에서 지정한 위치에 저장됩니다.`;} else $('#mapSelect').textContent=`${files.length}장에 GPS 정보가 없습니다. 창을 닫고 지도에서 공통 위치를 클릭해 지정하세요.`; updateCoords(); };
    async function savePhoto() { const files=[...fileInput.files]; if(!files.length){alert('저장할 사진 파일을 선택해주세요.');return;} if(state.pendingLocations.some(x=>!x)&&!state.selectedLocation){alert('GPS 위치가 없는 사진이 있습니다. 창을 닫고 지도에서 공통 위치를 클릭한 뒤 다시 시도해주세요.');return;} const button=$('#savePhoto'); button.disabled=true;button.textContent=`${files.length}장 저장 중…`; try { const commonTitle=titleInput.value.trim(); const photos=files.map((f,index)=>{const location=state.pendingLocations[index]||state.selectedLocation;return {id:crypto.randomUUID(),title:commonTitle?(files.length===1?commonTitle:`${commonTitle} ${index+1}`):f.name,originalName:f.name,file:f,lat:location.lat,lng:location.lng,createdAt:Date.now()};}); for(const p of photos)await store('put',p);state.photos.push(...photos);render();map.flyTo([photos[0].lat,photos[0].lng],14);dialog.close();$('#uploadForm').reset();state.pendingLocations=[];state.selectedLocation=null;updateCoords(); } catch(error) { console.error(error);alert('사진을 저장하지 못했습니다. 브라우저에서 이 파일의 저장 공간 사용을 허용한 뒤 다시 시도해주세요.'); } finally {button.disabled=false;button.textContent='사진 저장';} }
    $('#savePhoto').onclick=savePhoto; $('#uploadForm').onsubmit=e=>{e.preventDefault();savePhoto();};
    (async()=>{await openDB();state.photos=await store('readonly');try{state.zones=JSON.parse(localStorage.getItem('photo-map-zones')||'[]')}catch{}render();})();
  </script>
</body>
