<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사진 지도</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --navy:#12263a; --blue:#2563eb; --pale:#eff6ff; --line:#e4e8ee; --text:#18212c; }
    * { box-sizing:border-box; } body { margin:0; background:#f6f8fb; color:var(--text); font-family:"Paperlogy", "Noto Sans KR", sans-serif; }
    header { height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:#fff; border-bottom:1px solid var(--line); }
    .brand { font-family:"Paperlogy", "Noto Sans KR", sans-serif; font-size:20px; font-weight:700; color:var(--navy); }
    .layout { height:calc(100vh - 72px); display:grid; grid-template-columns:360px 1fr; gap:0; }
    aside { background:#fff; border-right:1px solid var(--line); padding:22px 20px; overflow-y:auto; position:relative; z-index:2; }
    h1 { margin:0 0 5px; font-size:20px; } .hint { margin:0 0 18px; color:#64748b; font-size:13px; line-height:1.55; }
    .add-button { border:0; width:100%; background:var(--blue); color:#fff; font:inherit; font-weight:600; border-radius:10px; padding:13px; cursor:pointer; box-shadow:0 5px 12px #2563eb33; }
    .add-button:hover { background:#1d4ed8; }.photo-count { margin:24px 0 11px; color:#64748b; font-size:13px; }.photo-list { display:grid; gap:10px; }
    .card { display:grid; grid-template-columns:74px 1fr; min-height:78px; border:1px solid var(--line); border-radius:11px; overflow:hidden; cursor:pointer; background:#fff; }.card:hover { border-color:#93c5fd; background:#fafcff; }.card img { width:74px; height:78px; object-fit:cover; }.card-info { padding:10px; min-width:0; }.card-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.card-location { margin-top:4px; font-size:11px; color:#64748b; }
    #map { width:100%; height:100%; }.empty { margin-top:15px; padding:20px 13px; border:1px dashed #cbd5e1; border-radius:10px; text-align:center; color:#64748b; font-size:13px; line-height:1.7; }
    .leaflet-popup-content-wrapper { border-radius:12px; }.popup { width:210px; }.popup img { width:100%; height:130px; object-fit:cover; border-radius:7px; }.popup h3 { margin:8px 0 2px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.popup p { color:#64748b; margin:0 0 9px; font-size:11px; }.popup-actions { display:flex; gap:6px; }.small-button { flex:1; padding:7px 5px; border:0; border-radius:7px; font:600 11px "Paperlogy", "Noto Sans KR", sans-serif; cursor:pointer; }.download { color:#1d4ed8; background:#dbeafe; }.delete { color:#b91c1c; background:#fee2e2; }
    dialog { border:0; border-radius:16px; padding:0; width:min(440px,calc(100% - 32px)); box-shadow:0 24px 70px #0f172a42; } dialog::backdrop { background:#0f172a70; }.modal { padding:23px; }.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }.modal-header h2 { margin:0; font-size:18px; }.close { border:0; background:transparent; font-size:25px; cursor:pointer; color:#64748b; }.field { display:grid; gap:7px; margin-bottom:15px; font-size:13px; font-weight:600; }.field input { width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:10px; font:inherit; }.coords { padding:11px; border-radius:8px; background:var(--pale); color:#1e40af; font-size:12px; line-height:1.5; }.map-select { margin:5px 0 17px; border-radius:8px; background:#fff7ed; color:#9a3412; padding:10px; font-size:12px; }.modal-actions { display:flex; justify-content:flex-end; gap:8px; }.cancel { border:1px solid #cbd5e1; background:white; }.modal-actions button { border-radius:8px; padding:10px 13px; font:600 13px "Paperlogy", "Noto Sans KR", sans-serif; cursor:pointer; }.save { border:0; background:var(--blue); color:white; }
    @media (max-width:720px) { header { height:58px; padding:0 17px; }.layout { height:calc(100vh - 58px); grid-template-columns:1fr; grid-template-rows:minmax(180px,38vh) 1fr; } aside { grid-row:1; border-right:0; border-bottom:1px solid var(--line); padding:15px 16px; }.photo-count { margin:15px 0 8px; }.photo-list { grid-template-columns:repeat(2,1fr); }.card { grid-template-columns:56px 1fr; min-height:60px; }.card img { width:56px;height:60px; }.card-info { padding:7px; }.card-location { display:none; } #map { grid-row:2; } }
  </style>
</head>
<body>
  <header><div class="brand">현장답사 쉐어링 : 당신의 사진은 어디에?</div><span style="font-size:12px;color:#64748b">내 기기에 안전하게 저장됨</span></header>
  <main class="layout">
    <aside><h1>나의 사진</h1><p class="hint">사진의 GPS를 자동으로 읽거나, 지도에서 직접 위치를 지정하세요.</p><button class="add-button" id="openUpload">+ 사진 추가</button><div class="photo-count" id="photoCount">사진 0장</div><div class="photo-list" id="photoList"></div><div class="empty" id="empty">아직 등록된 사진이 없습니다.<br>첫 사진을 지도에 올려보세요.</div></aside>
    <div id="map" aria-label="사진 지도"></div>
  </main>
  <dialog id="uploadDialog"><form class="modal" id="uploadForm"><div class="modal-header"><h2>사진 지도에 추가</h2><button class="close" type="button" id="closeDialog">×</button></div><label class="field">사진 파일<input id="photoInput" type="file" accept="image/*" required></label><label class="field">사진 제목<input id="titleInput" type="text" placeholder="예: 제주 해안 산책"></label><div class="coords" id="coords">사진을 선택하면 GPS 위치를 확인합니다.</div><div class="map-select" id="mapSelect">위치를 바꾸려면 아래 창을 닫고 지도에서 원하는 곳을 클릭하세요.</div><div class="modal-actions"><button class="cancel" type="button" id="cancel">취소</button><button class="save" type="submit">사진 저장</button></div></form></dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
  <script>
    const map = L.map('map').setView([37.5665,126.9780], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap contributors' }).addTo(map);
    const dialog = document.querySelector('#uploadDialog'), fileInput = document.querySelector('#photoInput'), titleInput = document.querySelector('#titleInput');
    const state = { selectedLocation:null, markers:new Map(), photos:[] };
    const $ = s => document.querySelector(s);
    let db;
    function openDB() { return new Promise((resolve,reject)=>{ const r=indexedDB.open('photo-map-db',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'}); r.onsuccess=()=>{db=r.result;resolve()}; r.onerror=()=>reject(r.error); }); }
    function store(mode, value) { return new Promise((resolve,reject)=>{const t=db.transaction('photos',mode); const req=value===undefined?t.objectStore('photos').getAll():t.objectStore('photos')[mode](value); req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);}); }
    const locText = p => `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;
    function markerIcon() { return L.divIcon({className:'',html:'<div style="width:32px;height:32px;border:3px solid white;border-radius:50% 50% 50% 0;background:#2563eb;transform:rotate(-45deg);box-shadow:0 2px 8px #0005"></div>',iconSize:[32,32],iconAnchor:[16,30]}); }
    function addMarker(photo) { const url=URL.createObjectURL(photo.file); const m=L.marker([photo.lat,photo.lng],{icon:markerIcon()}).addTo(map); const popup=`<div class="popup"><img src="${url}" alt=""><h3>${escapeHtml(photo.title)}</h3><p>${locText(photo)}</p><div class="popup-actions"><button class="small-button download" onclick="downloadPhoto('${photo.id}')">다운로드</button><button class="small-button delete" onclick="deletePhoto('${photo.id}')">삭제</button></div></div>`; m.bindPopup(popup); state.markers.set(photo.id,m); }
    function escapeHtml(value){const d=document.createElement('div');d.textContent=value;return d.innerHTML}
    async function render() { state.markers.forEach(m=>map.removeLayer(m));state.markers.clear(); $('#photoList').innerHTML=''; $('#photoCount').textContent=`사진 ${state.photos.length}장`; $('#empty').style.display=state.photos.length?'none':'block'; state.photos.forEach(p=>{ addMarker(p); const u=URL.createObjectURL(p.file); const c=document.createElement('article');c.className='card'; c.innerHTML=`<img src="${u}" alt=""><div class="card-info"><div class="card-title">${escapeHtml(p.title)}</div><div class="card-location">${locText(p)}</div></div>`;c.onclick=()=>{map.flyTo([p.lat,p.lng],15);state.markers.get(p.id).openPopup()};$('#photoList').append(c); }); }
    window.downloadPhoto = id => { const p=state.photos.find(x=>x.id===id);const a=document.createElement('a');a.href=URL.createObjectURL(p.file);a.download=p.originalName||p.title;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    window.deletePhoto = async id => { const p=state.photos.find(x=>x.id===id); if(!confirm(`“${p.title}” 사진을 삭제할까요?`))return; await store('delete',id);state.photos=state.photos.filter(x=>x.id!==id);render(); };
    function updateCoords(){ $('#coords').textContent=state.selectedLocation?`선택된 위치: ${locText(state.selectedLocation)}`:'사진을 선택하면 GPS 위치를 확인합니다.'; }
    map.on('click',e=>{ state.selectedLocation=e.latlng; updateCoords(); $('#mapSelect').textContent='지도에서 위치를 선택했습니다. 이제 사진 추가를 눌러 저장하세요.'; });
    $('#openUpload').onclick=()=>dialog.showModal(); $('#closeDialog').onclick=$('#cancel').onclick=()=>dialog.close();
    fileInput.onchange=async()=>{const f=fileInput.files[0];if(!f)return; try { const gps=await exifr.gps(f);if(gps&&gps.latitude){state.selectedLocation={lat:gps.latitude,lng:gps.longitude};$('#mapSelect').textContent='사진 GPS 위치를 자동으로 찾았습니다. 필요하면 지도를 클릭해 변경하세요.';}else $('#mapSelect').textContent='GPS 정보가 없습니다. 창을 닫고 지도에서 위치를 클릭해 지정하세요.';} catch { $('#mapSelect').textContent='GPS를 읽지 못했습니다. 지도에서 위치를 직접 지정하세요.';}updateCoords();};
    $('#uploadForm').onsubmit=async e=>{e.preventDefault();const f=fileInput.files[0];if(!state.selectedLocation){alert('사진 위치가 없습니다. 창을 닫고 지도에서 위치를 클릭한 뒤 다시 시도해주세요.');return;} const p={id:crypto.randomUUID(),title:titleInput.value.trim()||f.name,originalName:f.name,file:f,lat:state.selectedLocation.lat,lng:state.selectedLocation.lng,createdAt:Date.now()};await store('put',p);state.photos.push(p);render();map.flyTo([p.lat,p.lng],14);dialog.close();e.target.reset();state.selectedLocation=null;updateCoords();};
    (async()=>{await openDB();state.photos=await store('readonly');render();})();
  </script>
</body>
</html>
